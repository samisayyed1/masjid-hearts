# Pages CMS (https://pagescms.org): the browser editor for this site. How to use it: EDITING.md
# Generated by scripts/cms-config.py. Edit that script (or scripts/cms-articles.yml), not this file.
media:
- name: articles
  label: Article photos
  input: src/assets/articles
  output: ../../assets/articles
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
  rename: safe
- name: site
  label: Site photos
  input: src/assets/site
  output: src/assets/site
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
  rename: safe
content:
- name: articles
  label: Articles
  type: collection
  path: src/content/articles
  filename: '{primary}.md'
  view:
    fields:
    - title
    - category
    - date
    - draft
    sort:
    - date
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: summary
    label: Summary
    description: One or two sentences, 220 characters at most. Shown on cards and in search results.
    type: text
    required: true
    options:
      maxlength: 220
  - name: date
    label: Publish date
    type: date
    required: true
  - name: category
    label: Category
    type: select
    required: true
    options:
      values:
      - Faith
      - Community
      - Giving
      - Masajid
  - name: author
    label: Author
    type: string
    default: Masjid Hearts
  - name: cover
    label: Thumbnail / cover photo (optional)
    type: image
    options:
      media: articles
    description: Shown on article cards and at the top of the article. Landscape, at least 1600 px wide. Without a photo, a pattern is drawn instead.
  - name: coverAlt
    label: Describe the cover photo (for screen readers)
    type: string
  - name: motif
    label: Cover pattern (used when there is no photo)
    type: select
    default: star
    options:
      values:
      - star
      - arch
      - lattice
      - dome
  - name: featured
    label: Feature at the top of the home page
    type: boolean
    default: false
  - name: draft
    label: Draft (hidden from the site)
    type: boolean
    default: false
  - name: body
    label: Article
    type: rich-text
- name: settings
  label: Site settings
  type: file
  path: src/content/site/settings.json
  format: json
  fields:
  - name: name
    label: Organisation name
    type: string
    required: true
  - name: email
    label: Contact email
    type: string
    description: Shown in the footer. The contact form sends to it (opens the visitor's email app) unless a form service URL is set.
  - name: formEndpoint
    label: Form service URL (optional)
    type: string
    description: e.g. a Formspree or Basin form URL. When set, the contact form sends messages straight there.
  - name: donateUrl
    label: Donation page link
    type: string
    description: Where every "Give" button goes. Leave empty to send people to the contact form instead.
  - name: social
    label: Social links
    type: object
    description: Full links starting with https://. Empty ones are hidden.
    fields:
    - name: instagram
      label: Instagram
      type: string
    - name: facebook
      label: Facebook
      type: string
    - name: youtube
      label: YouTube
      type: string
    - name: x
      label: X (Twitter)
      type: string
    - name: linkedin
      label: LinkedIn
      type: string
    - name: tiktok
      label: TikTok
      type: string
  - name: givingLevels
    label: Monthly giving amounts (USD)
    type: object
    list: true
    description: The wording for each card is under Home page text, in the same order.
    fields:
    - name: amount
      label: Amount per month
      type: number
      required: true
    - name: masajid
      label: Hearts on the card (1 to 12)
      type: number
  - name: photo
    label: Large photo on the home page
    type: image
    options:
      media: site
    description: Use a wide photo at least 1600 px across that Masjid Hearts has the right to publish.
